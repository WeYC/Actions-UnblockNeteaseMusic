name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号 Version e.g. 0.28.*"
        required: false
        default: "0.28.1"
        type: string

env:
  image: ghcr.io/weyc/actions-unblockneteasemusic

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: UnblockNeteaseMusic/server
          ref: enhanced
          fetch-depth: 0

      - name: Merge PR #1754
        run: |
          git fetch origin pull/1754/head:pr-1754
          git merge --no-edit pr-1754
          git log --oneline -5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.image }}:latest
            ${{ env.image }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
