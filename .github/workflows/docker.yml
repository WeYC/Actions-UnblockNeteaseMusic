name: Build Docker Image

# 与上游的差异：上游 enhanced 不含 xeapi 支持（PR #1754 至今未合并），
# iOS 新版客户端全部走 xeapi，不合并则音源替换失效。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号 Version e.g. 0.28.1"
        required: false
        default: "0.28.1"
        type: string
      core_repo:
        description: "core 来源仓库"
        required: false
        default: "WeYC/UnblockNeteaseMusic"
        type: choice
        options:
          - WeYC/UnblockNeteaseMusic
          - UnblockNeteaseMusic/server

env:
  image: ghcr.io/weyc/unblockneteasemusic
  image_hub: weycovo/unblockneteasemusic
  CORE_REPO: ${{ inputs.core_repo || 'WeYC/UnblockNeteaseMusic' }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout core
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CORE_REPO }}
          ref: main
          fetch-depth: 0

      # 只有回退到上游时才需要现场合 PR：自己的 main 已包含这些提交。
      - name: Merge PR #1754 (upstream only)
        if: env.CORE_REPO == 'UnblockNeteaseMusic/server'
        run: |
          git fetch origin pull/1754/head:pr-1754
          git merge --no-edit pr-1754
          git log --oneline -5

      - name: Verify xeapi support
        run: |
          if ! grep -q 'xeapi' src/hook.js; then
            echo "::error::core 缺少 xeapi 支持，iOS 端会失效"
            exit 1
          fi
          echo "xeapi 支持已就位"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pin Node base for arm/v7
        run: |
          sed -i 's|^FROM node:lts-alpine|FROM node:22-alpine3.21|' Dockerfile
          head -1 Dockerfile

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          push: true
          tags: |
            ${{ env.image }}:latest
            ${{ env.image }}:${{ inputs.tag }}
            ${{ env.image_hub }}:latest
            ${{ env.image_hub }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout builder files
        uses: actions/checkout@v7
        with:
          path: .builder

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: weycovo/unblockneteasemusic
          readme-filepath: .builder/README.md
