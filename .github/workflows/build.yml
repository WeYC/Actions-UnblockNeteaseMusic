name: Build Actions-UnblockNeteaseMusic

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号 Version e.g. 0.28.*"
        required: false
        default: "0.28.1"
        type: string

jobs:
  build:
    strategy:
      matrix:
        target: ["win-x64"]
      fail-fast: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        # 旧配置（保留）：未指定 ref（默认分支）、fetch-depth 默认 1
        uses: actions/checkout@v7
        with:
          repository: UnblockNeteaseMusic/server
          ref: enhanced
          fetch-depth: 0

      - name: Merge PR #1754
        run: |
          git fetch origin pull/1754/head:pr-1754
          git merge --no-edit pr-1754
          git log --oneline -5

      - name: Checkout builder files
        uses: actions/checkout@v7
        with:
          path: .builder

      - name: Apply startup-config patch
        run: |
          git apply --verbose .builder/patches/config-ini.patch
          node --check src/config-file.js
          git status --short

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Install dependencies
        run: yarn

      - name: Make bundle
        run: yarn build

      - name: Building executable file for ${{ matrix.target }}
        run: |
          npx pkg --compress Brotli -t node18-${{ matrix.target }} .
          mv "$(ls dist/*)" "$(ls dist/* | sed 's/server/unblockneteasemusic-${{ matrix.target }}/g')"
          echo "ASSET_NAME=$(ls dist)" >> $GITHUB_ENV

      # 配置文件改由 exe 首次启动时就地自动生成，不再随包发布（旧生成步骤见 6a83d35）

      - name: Publishing to GitHub Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: ./dist/*

      - name: Publishing to GitHub Releases
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
