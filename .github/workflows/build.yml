name: Build Actions-UnblockNeteaseMusic

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag 名，为空则只上传 Artifact，不发布到 Release"
        required: false
        default: ""
        type: string

jobs:
  build:
    strategy:
      matrix:
        target: ["win-x64"]
      fail-fast: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        # 旧配置（保留）：未指定 ref（默认分支）、fetch-depth 默认 1
        uses: actions/checkout@v7
        with:
          repository: UnblockNeteaseMusic/server
          ref: enhanced
          fetch-depth: 0

      - name: Merge PR #1754
        run: |
          git fetch origin pull/1754/head:pr-1754
          git merge --no-edit pr-1754
          git log --oneline -5

      - name: Checkout builder files
        uses: actions/checkout@v7
        with:
          path: .builder

      - name: Apply startup-config patch
        run: |
          git apply --verbose .builder/patches/config-ini.patch
          node --check src/config-file.js
          git status --short

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Install dependencies
        run: yarn

      - name: Make bundle
        run: yarn build

      - name: Building executable file for ${{ matrix.target }}
        run: |
          npx pkg --compress Brotli -t node18-${{ matrix.target }} .
          mv "$(ls dist/*)" "$(ls dist/* | sed 's/server/unblockneteasemusic-${{ matrix.target }}/g')"
          echo "ASSET_NAME=$(ls dist)" >> $GITHUB_ENV

      # 旧方案（保留思路）：曾生成 start.bat，详见 d34b136；现改由 exe 启动时直接读 config.ini
      - name: Generate config.ini
        run: |
          cat > ./dist/config.ini <<EOF
          ; UnblockNeteaseMusic 配置文件（CI 自动生成，记事本可直接改）
          ; 放在 exe 同目录下，启动时自动加载；命令行 -o 优先于这里

          [source]
          ; 音源顺序，默认只开免 cookie、大陆可用的 6 路
          order = kugou bodian kuwo bilibili bilivideo pyncmd

          [cookie]
          ; 有 cookie 就填等号后面，没有留空
          ; QQ 音乐：uin=你的uin; qm_keyst=你的qm_keyst
          qq =
          ; 咪咕：你的aversionid
          migu =
          ; JOOX：wmid=你的wmid; session_key=你的session_key（仅港澳台泰马印尼）
          joox =
          EOF
          sed -i 's/$/\r/' ./dist/config.ini
          ls dist/

      - name: Publishing to GitHub Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: ./dist/*

      - name: Publishing to GitHub Releases
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
